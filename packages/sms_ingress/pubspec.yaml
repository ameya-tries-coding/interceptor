    sdk: flutter
  permission_handler: ^11.0.0
  telephony: ^0.2.0
  shared_preferences: ^2.2.3
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
